<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aviator Real-Time Bot</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .card { background: #161b22; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; }
        #multiplier { font-size: 60px; font-weight: bold; color: #3fb950; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aviator Real-Time Signal</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <div id="multiplier">--</div>
    </div>

    <script>
        async function fetchLiveData() {
            try {
                let response = await fetch('/get-live-data');
                let data = await response.json();
                document.getElementById('status').innerText = data.status;
                document.getElementById('multiplier').innerText = data.multiplier;
            } catch (err) {
                console.error("Error fetching live data", err);
            }
        }
        setInterval(fetchLiveData, 1000);
    </script>
</body>
</html>
