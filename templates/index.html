<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Bot Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0e1117; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #161b22; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        h1 { color: #58a6ff; }
        .status { font-size: 20px; margin: 10px 0; }
        .multiplier { font-size: 40px; font-weight: bold; color: #2ea043; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aviator Live Bot</h1>
        <div class="status">Status: <span id="status">Connecting...</span></div>
        <div class="multiplier" id="multiplier">Waiting...</div>
    </div>

    <script>
        async function fetchLiveData() {
            try {
                const response = await fetch('/get-live-data');
                const data = await response.json();
                document.getElementById('status').innerText = data.status;
                document.getElementById('multiplier').innerText = data.multiplier;
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // প্রতি ১ সেকেন্ড পর পর সার্ভার থেকে ডাটা রিফ্রেশ করবে
        setInterval(fetchLiveData, 1000);
    </script>
</body>
</html>
