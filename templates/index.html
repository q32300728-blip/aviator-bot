<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Predictor</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1c2541;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 1px solid #3a506b;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #8da9c4;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #0b132b;
            padding: 10px;
            border-radius: 10px;
            width: 30%;
            border: 1px solid #3a506b;
        }
        .stat-box span {
            display: block;
            font-size: 12px;
            color: #8da9c4;
        }
        .stat-box strong {
            font-size: 14px;
            color: #00f5d4;
        }
        .target-circle {
            width: 180px;
            height: 180px;
            border: 3px dashed #00f5d4;
            border-radius: 50%;
            margin: 25px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 245, 212, 0.05);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
        }
        .target-circle h4 {
            margin: 0;
            font-size: 12px;
            color: #8da9c4;
            letter-spacing: 1px;
        }
        .target-circle h1 {
            margin: 5px 0 0 0;
            font-size: 32px;
            color: #00f5d4;
        }
        .status-badge {
            background: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            border: 1px solid #2ed573;
            padding: 8px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            background: #0b132b;
            border: 1px solid #3a506b;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 95%;
            padding: 12px;
            background: linear-gradient(135deg, #00f5d4, #7209b7);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
            color: #00f5d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>← AVIATOR HACK</span>
            <span>🟢 LIVE</span>
        </div>

        <h3>AVIATOR PREDICT</h3>
        <p style="font-size: 13px; color: #8da9c4;">Balance: ${{ game.balance }}</p>

        <div class="stats-grid">
            <div class="stat-box">
                <span>ACCURACY</span>
                <strong>99.99%</strong>
            </div>
            <div class="stat-box">
                <span>MODE</span>
                <strong>AUTO</strong>
            </div>
            <div class="stat-box">
                <span>WIN RATE</span>
                <strong>99%</strong>
            </div>
        </div>

        <div class="target-circle">
            <h4>TARGET NEXT</h4>
            <h1>{{ game.multiplier }}x</h1>
            <span style="font-size: 10px; color: #2ed573; margin-top: 5px;">LIVE FLIGHT</span>
        </div>

        <div class="status-badge">
            📡 SIGNAL ACTIVE
        </div>

        <form action="/play" method="post">
            <input type="number" name="bet" step="0.1" placeholder="Enter Bet Amount" required>
            <button type="submit">GENERATE NEXT SIGNAL</button>
        </form>

        <div class="message">
            <p>{{ game.message }}</p>
        </div>
    </div>
</body>
</html>
