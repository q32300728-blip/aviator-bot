<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Trading Bot</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 40px; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; }
        select { background: #334155; color: white; }
        button { background: #2563eb; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .mic-btn { background: #16a34a; }
        .mic-btn:hover { background: #15803d; }
        .status { color: #facc15; font-style: italic; margin: 15px 0; min-height: 40px; }
        .result { font-size: 18px; font-weight: bold; margin-top: 15px; color: #4ade80; }
        .timer { font-size: 22px; color: #38bdf8; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>OTC Voice AI Bot</h2>
        
        <label>টাইম সিলেক্ট করুন (মিনিট):</label>
        <select id="timeInput">
            <option value="1">১ মিনিট</option>
            <option value="2">২ মিনিট</option>
            <option value="5">৫ মিনিট</option>
        </select>
        
        <button onclick="startBot()">বট স্টارت করুন</button>
        <button class="mic-btn" onclick="startVoiceInput()">🎤 মুখে বলুন (Voice Command)</button>
        
        <div class="status" id="statusText">বট নিষ্ক্রিয় আছে।</div>
        <div class="timer" id="timerDisplay"></div>
        <div class="result" id="resultDisplay"></div>
    </div>

    <script>
        // বটের কথা বলার ফাংশন (Text-to-Speech)
        function speakText(text) {
            let speech = new SpeechSynthesisUtterance();
            speech.text = text;
            speech.lang = 'bn-BD'; // বাংলা ভাষা
            speech.rate = 1.0;
            window.speechSynthesis.speak(speech);
        }

        // ব্যবহারকারীর কথা শোনার ফাংশন (Speech Recognition)
        function startVoiceInput() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                alert("আপনার ব্রাউজার ভয়েস কমান্ড সাপোর্ট করে না।");
                return;
            }
            
            let recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            
            document.getElementById('statusText').innerHTML = "শুনছি... আপনার কমান্ড বলুন।";
            speakText("শুনছি, বলুন");

            recognition.onresult = function(event) {
                let spokenText = event.results[0][0].transcript;
                document.getElementById('statusText').innerHTML = `আপনি বলেছেন: "${spokenText}"`;
                
                // মুখে বলার পর স্বয়ংক্রিয়ভাবে বট অ্যানালিসিস শুরু করবে
                triggerBotProcess(spokenText);
            };

            recognition.start();
        }

        function startBot() {
            let minutes = document.getElementById('timeInput').value;
            triggerBotProcess("Manual Start", minutes);
        }

        function triggerBotProcess(command, customTime = null) {
            let minutes = customTime || document.getElementById('timeInput').value;
            let statusText = document.getElementById('statusText');
            let timerDisplay = document.getElementById('timerDisplay');
            let resultDisplay = document.getElementById('resultDisplay');
            
            resultDisplay.innerHTML = "";
            let initialMsg = "ট্রেডিং চ্যাটে আছি এবং গভীরভাবে এনালাইসিস করতেছি, আপনি অপেক্ষা করুন...";
            statusText.innerHTML = initialMsg;
            speakText(initialMsg);
            
            setTimeout(() => {
                let processingMsg = "মার্কেট লিকুইডিটি যাচাই করা হয়েছে। সিগন্যাল তৈরি হচ্ছে...";
                statusText.innerHTML = processingMsg;
                
                fetch('/get_signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timeframe: minutes, command: command })
                })
                .then(response => response.json())
                .then(data => {
                    statusText.innerHTML = "সফলভাবে সিগন্যাল জেনারেট করা হয়েছে!";
                    resultDisplay.innerHTML = `সিগন্যাল: ${data.signal} <br>অ্যাকুরেসি: ${data.confidence}%`;
                    
                    // বট মুখে ফলাফল বলে দেবে
                    speakText(data.message);
                    
                    // টাইমার শুরু করা
                    startTimer(data.timeframe * 60, timerDisplay);
                });
            }, 3000);
        }

        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            let countdown = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerHTML = `পরবর্তী সিগন্যালের সময় বাকি: ${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(countdown);
                    display.innerHTML = "সময় শেষ! নতুন সিগন্যালের জন্য প্রস্তুত হন।";
                    speakText("সময় শেষ, নতুন সিগন্যালের জন্য প্রস্তুত হন।");
                }
            }, 1000);
        }
    </script>
</body>
</html>
