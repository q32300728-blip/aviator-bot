<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Live Bot - 77kk</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 80%; max-width: 500px; }
        .status { color: #f59e0b; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .connected { color: #22c55e !important; }
        .data-box { background: #0f172a; padding: 15px; margin-top: 20px; border-radius: 8px; font-family: monospace; color: #38bdf8; word-break: break-all; min-height: 50px; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AVIATOR LIVE BOT</h1>
        <p>Target: 77kk Stream</p>
        <div id="status" class="status">Connecting to WebSocket...</div>
        <div id="dataBox" class="data-box">Waiting for live packets...</div>
    </div>

    <script>
        const wsUri = "wss://channel.local2j111.link/get";
        const statusEl = document.getElementById("status");
        const dataBoxEl = document.getElementById("dataBox");

        function connectWebSocket() {
            const ws = new WebSocket(wsUri);

            ws.onopen = () => {
                statusEl.innerText = "Status: Live Connected!";
                statusEl.classList.add("connected");
                console.log("Connected to Live WebSocket");
            };

            ws.onmessage = async (event) => {
                // ডাটা বাইনারি বা টেক্সট যাই হোক না কেন হ্যান্ডেল করা
                let displayData = "";
                if (event.data instanceof Blob) {
                    const buffer = await event.data.arrayBuffer();
                    const bytes = new Uint8Array(buffer);
                    displayData = "Binary Packet (Hex): " + Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 60) + "...";
                } else {
                    displayData = "Text Packet: " + event.data;
                }
                dataBoxEl.innerText = displayData;
            };

            ws.onerror = (error) => {
                statusEl.innerText = "Status: Connection Error";
                console.error("WebSocket Error:", error);
            };

            ws.onclose = () => {
                statusEl.innerText = "Status: Reconnecting in 3s...";
                statusEl.classList.remove("connected");
                setTimeout(connectWebSocket, 3000); // অটো রিকানেক্ট লজিক
            };
        }

        // পেজ লোড হওয়ার সাথে সাথে কানেকশন শুরু হবে
        connectWebSocket();
    </script>
</body>
</html>
