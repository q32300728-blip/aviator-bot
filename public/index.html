<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC & ICT Pro Scanner Bot</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 40px; }
        .scanner-card { border: 2px solid #00ffcc; border-radius: 20px; display: inline-block; padding: 30px; background: #131722; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4); max-width: 450px; width: 90%; }
        h1 { color: #00ffcc; font-size: 22px; margin-bottom: 5px; }
        .sub-title { font-size: 12px; color: #888; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .status { font-size: 14px; color: #ffaa00; margin-bottom: 15px; font-weight: bold; }
        .concept-box { background: #1e222d; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: left; border-left: 4px solid #00ffcc; }
        .reasoning { font-size: 13px; color: #ccc; margin-bottom: 20px; text-align: left; font-style: italic; }
        .signal { font-size: 32px; font-weight: bold; margin: 15px 0; padding: 10px; border-radius: 10px; }
        .call { color: #00ffcc; background: rgba(0, 255, 204, 0.1); }
        .put { color: #ff3366; background: rgba(255, 51, 102, 0.1); }
        .accuracy { font-size: 13px; color: #00ffcc; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="scanner-card">
        <h1>PROFIT HACKER BOT</h1>
        <div class="sub-title">SMC & ICT Institutional Engine</div>
        <div class="status" id="status">SCANNING 1M MARKET STRUCTURE...</div>
        
        <div class="concept-box" id="conceptBox">
            Waiting for institutional setup match...
        </div>

        <div class="reasoning" id="reasoningBox">
            Analyzing Order Blocks, FVG, and Liquidity Pools...
        </div>

        <div class="signal" id="signalText">WAITING</div>
        <div class="accuracy" id="accuracyText">Accuracy: --%</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('signalUpdate', (data) => {
            document.getElementById('status').innerText = `Active Asset: ${data.asset}`;
            document.getElementById('conceptBox').innerHTML = `<b>Trigger Concept:</b><br>${data.concept}`;
            document.getElementById('reasoningBox').innerHTML = `<b>Human Logic:</b> ${data.reasoning}`;
            
            const sigElement = document.getElementById('signalText');
            sigElement.innerText = data.signal;
            sigElement.className = 'signal ' + (data.signal.includes('CALL') ? 'call' : 'put');
            
            document.getElementById('accuracyText').innerText = `Estimated Accuracy: ${data.confidence}%`;
        });
    </script>
</body>
</html>
